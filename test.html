<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messenger - Lektion 6</title>

  <link rel="stylesheet" href="test.css" />
</head>
<body>
  <div class="app">

    <!-- =========================================================
         HEADER
    ========================================================= -->
    <header class="app-header">
      <div class="header-banner">
        <div class="brand">
          <div class="brand-logo">M</div>

          <div>
            <h1 id="uber">Messenger</h1>
            <p id="user-greeting">
              Willkommen!
            </p>
          </div>
        </div>
      </div>
    </header>

    <!-- =========================================================
         MAIN
    ========================================================= -->
    <div class="layout">

      <!-- SIDEBAR -->
      <aside class="sidebar">

        <section class="card">
          <div class="lesson-badge">M</div>
          <h2 class="section-title">Mein Profil</h2>

          <div class="profile-box">
            <div class="avatar" id="profile-avatar">M</div>

            <div class="profile-info">
              <h2 id="profilename">AnaAtwell</h2>
              <p id="profile-username" class="muted">@ana_dev</p>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="lesson-badge">M</div>
          <h2 class="section-title">Kontakte</h2>

          <div class="contacts-search">
            <input
              type="text"
              id="contact-search"
              class="input"
              placeholder="Kontakt suchen..."
             
            />
          </div>

          <div class="contacts-list" id="contacts-list">
            <div id="a" class="contact-item"><img class="contact-avatar" src="https://i.pravatar.cc/40?u=Anna" alt="" />Anna</div>
            <div id="b"  class="contact-item"><img class="contact-avatar" src="https://i.pravatar.cc/40?u=Ben" alt="" />Ben</div>
            <div id="c"  class="contact-item"><img class="contact-avatar" src="https://i.pravatar.cc/40?u=Clara" alt="" />Clara</div>
          </div>
        </section>
      </aside>

      <!-- CHAT -->
      <main class="main">
        <section class="chat-topbar">
          <h2>Chat-Verlauf</h2>
        </section>

        <section class="chat-area" id="chat-area">
          <!-- Nachrichten kommen mit JavaScript -->
        </section>

        <section class="message-panel">
          <form id="message-form">
            <label for="message-input" class="section-title">Neue Nachricht</label>

            <div class="form-row">
              <input
                type="text"
                id="message-input"
                class="input message-input"
                placeholder="Schreibe eine Nachricht..."
               
              />

              <button type="button" class="btn" id="toggle-emoji-btn">😊 Emoji</button>
              <button type="submit" class="btn btn-primary">Senden</button>
            </div>

            <div class="emoji-panel" id="emoji-panel"></div>

            <div class="form-info">
              <p class="validation-message" id="validation-message"></p>
              <p>Zeichen: <span id="char-count">0</span></p>
            </div>
          </form>
        </section>
      </main>
    </div>

    <footer class="app-footer">
      Messenger Projekt – vereinfachte Version
    </footer>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
